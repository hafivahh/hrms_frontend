stages:          # List of stages for jobs, and their order of execution
  - ticket
  - build
  - docker-build
  - deploy

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false" # Memastikan daemon tidak digunakan dalam CI untuk menghemat memori

ticket-job:
  stage: ticket
  script:
    - echo "Starting Ticketing...."
    - echo "$CI_COMMIT_SHA"
    - |
      curl -k --data "{\"message\":\"$CI_COMMIT_SHA\", \"id_project\":\"$CI_PROJECT_ID\"}" -H 'Content-Type: application/json' -X POST $HOST_TICKET_API
    - echo "Ticket Submitted."

